[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[project]
name = "NYC_TLC"
requires-python = ">=3.13"
version = "0.1.0"
description = "A NYC taxi data warehouse project"
dependencies = [
    "duckdb>=2.0.1",
    "faker>=40.63.0",
    "pandas>=3.1.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "sqlfluff>=4.5.0",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.sqlfluff.core]
dialect = "duckdb"